<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GimbalCam</title>
<style>
:root{
  --bg:#0d0f13; --panel:#151920; --panel2:#1b2029; --line:#262c37; --line2:#313846;
  --fg:#e9edf3; --mut:#8b95a5; --mut2:#5f6878;
  --acc:#4f8cff; --acc2:#3a6fd8; --ok:#34d399; --warn:#fbbf24; --rec:#f43f5e; --stop:#ef4444;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:56px 1fr 30px;height:100vh}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0f1217}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px;margin-inline-end:8px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#7c5cff);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:12.5px;white-space:nowrap}
.pill b{color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--stop)}
.spacer{flex:1}
.lang{height:32px;border-radius:9px;background:var(--panel);border:1px solid var(--line);padding:0 8px}
.btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.btn:hover{border-color:#46506a;background:#222836}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:transparent}
.btn.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.5);color:var(--warn)}
.stopbtn{height:38px;padding:0 18px;border-radius:11px;border:0;background:var(--stop);color:#fff;font-weight:800;letter-spacing:.6px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(239,68,68,.25)}
.stopbtn:hover{filter:brightness(1.08)}
.stopbtn:active{transform:translateY(1px)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:1fr 372px;min-height:0}
.stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px;gap:12px}
.stage{position:relative;flex:1;min-height:0;border-radius:var(--r);background:#000;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.stage img{max-width:100%;max-height:100%;display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#141a24 0%,#07090c 75%)}
.qrcard{display:flex;gap:28px;align-items:center;background:rgba(21,25,32,.9);border:1px solid var(--line);border-radius:18px;padding:26px 30px;max-width:min(760px,92%)}
.qrcard img{width:220px;height:220px;border-radius:12px;background:#fff;padding:8px}
.qrcard h2{margin:0 0 12px;font-size:21px}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:var(--mut)}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg)}
.small{font-size:12px;color:var(--mut2)}
.badge{position:absolute;top:14px;inset-inline-start:14px;display:flex;gap:8px}
.recbadge{display:none;align-items:center;gap:8px;background:rgba(244,63,94,.92);color:#fff;font-weight:700;border-radius:8px;padding:5px 10px;font-variant-numeric:tabular-nums}
.recbadge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.pausedov{position:absolute;inset:0;display:none;place-items:center;background:rgba(7,9,12,.66);backdrop-filter:blur(2px)}
.pausedov div{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center}

.recbar{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.recbtn{height:42px;padding:0 18px 0 12px;border-radius:12px;border:1px solid rgba(244,63,94,.45);background:rgba(244,63,94,.1);color:#ffd5dc;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.recbtn .c{width:20px;height:20px;border-radius:50%;background:var(--rec);transition:all .2s}
.recbtn.on{background:var(--rec);color:#fff}
.recbtn.on .c{border-radius:5px;background:#fff;width:16px;height:16px}
.recbtn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-weight:600;font-size:13px}
.seg button.sel{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 0 0 1px var(--line2)}
.lbl{color:var(--mut);font-size:12.5px}
.filestat{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--mut);font-size:12.5px;min-width:0;flex:1}
.filestat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;color:var(--acc);padding:0;font-weight:600}

/* ---------- sidebar ---------- */
.side{border-inline-start:1px solid var(--line);background:#10131a;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#262c37;border-radius:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .st{margin-inline-start:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.row:first-of-type{margin-top:0}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:6px;justify-content:center;margin:12px 0 4px}
.pad button{border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:16px;touch-action:none}
.pad button:active,.pad button.held{background:var(--acc);border-color:var(--acc);color:#fff}
.pad .c{background:transparent;border-style:dashed;color:var(--mut)}
.slider{display:grid;grid-template-columns:104px 1fr 52px;align-items:center;gap:8px;margin-top:9px}
.slider label{color:var(--mut);font-size:12.5px}
.slider output{text-align:end;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--acc) var(--p,50%),#2a303b var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{display:none}
.toggle .sw{width:36px;height:21px;border-radius:21px;background:#2a303b;position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.toggle input:checked+.sw{background:var(--acc)}
.toggle input:checked+.sw::after{inset-inline-start:18px}
.toggle .t{display:flex;flex-direction:column}
.toggle .t small{color:var(--mut2);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12.5px;font-weight:600}
.chip.sel{background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.55);color:#cfe0ff}
.hint{color:var(--mut2);font-size:12px;margin-top:8px}
.err{color:#fca5a5;font-size:12px;margin-top:8px}
.foot{display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--line);color:var(--mut2);font-size:12px;background:#0f1217}
kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--mut);background:var(--panel)}
[dir=rtl] .pad{direction:ltr}
[dir=rtl] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to left,var(--acc) var(--p,50%),#2a303b var(--p,50%))}
.disc{position:fixed;inset:0;display:none;place-items:center;background:rgba(7,9,12,.85);z-index:10;font-size:16px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M3 12h3M18 12h3M12 3v3M12 18v3"/></svg></div>GimbalCam</div>
    <span class="pill"><span class="dot" id="phoneDot"></span><span data-i="phone"></span> <b id="phoneTxt"></b></span>
    <span class="pill"><span class="dot" id="gimbalDot"></span><span data-i="gimbal"></span> <b id="gimbalTxt"></b></span>
    <span class="pill"><span data-i="latency"></span> <b id="latTxt">—</b> · <b id="fpsTxt">0</b> fps</span>
    <div class="spacer"></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="tr">Türkçe</option><option value="en">English</option><option value="es">Español</option>
      <option value="ru">Русский</option><option value="zh">中文</option><option value="ar">العربية</option>
    </select>
    <button class="btn" id="pauseBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span id="pauseTxt"></span></button>
    <button class="stopbtn" id="stopBtn" data-it="stop_tip"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span data-i="stop"></span></button>
    <button class="iconbtn" id="quitBtn" data-it="quit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
  </header>

  <div class="main">
    <section class="stagewrap">
      <div class="stage" id="stage">
        <img id="preview" alt="">
        <div class="badge"><div class="recbadge" id="recBadge"><i></i><span data-i="rec"></span> <span id="recTime">00:00</span></div></div>
        <div class="overlay" id="qrOverlay">
          <div class="qrcard">
            <img id="qr" alt="QR">
            <div>
              <h2 data-i="qr_title"></h2>
              <ol class="steps">
                <li><span class="n">1</span><span data-i="qr_step1"></span></li>
                <li><span class="n">2</span><span data-i="qr_step2"></span></li>
                <li><span class="n">3</span><span data-i="qr_step3"></span></li>
              </ol>
              <p class="small" style="margin:14px 0 0"><span data-i="same_wifi"></span><br><span id="url" style="user-select:text"></span></p>
            </div>
          </div>
        </div>
        <div class="pausedov" id="pausedOv"><div><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span data-i="paused"></span></div></div>
      </div>

      <div class="recbar">
        <button class="recbtn" id="recBtn"><span class="c"></span><span id="recBtnTxt"></span></button>
        <span class="lbl" data-i="quality"></span>
        <div class="seg" id="qualitySeg">
          <button data-v="4k30">4K30</button><button data-v="1080p30">1080p30</button><button data-v="720p60">720p60</button>
        </div>
        <span class="lbl" data-i="zoom"></span>
        <div class="seg" id="zoomSeg">
          <button data-v="0.5">.5×</button><button data-v="1">1×</button><button data-v="2">2×</button><button data-v="5">5×</button>
        </div>
        <div class="filestat" id="fileStat"></div>
        <button class="btn ghost" id="folderBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i="open_folder"></span></button>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h3><span data-i="gimbal_card"></span><span class="st"><span class="dot" id="gDot2"></span><span id="gStatus"></span></span></h3>
        <div class="row">
          <button class="btn primary" id="gConnect"></button>
          <div class="chips" id="gModes">
            <button class="chip" data-v="PF">PF</button><button class="chip" data-v="L">L</button><button class="chip" data-v="F">F</button><button class="chip" data-v="POV">POV</button><button class="chip" data-v="GO">GO</button>
          </div>
        </div>
        <div class="pad">
          <span></span><button data-d="up">▲</button><span></span>
          <button data-d="left">◀</button><button class="c" id="padStop">■</button><button data-d="right">▶</button>
          <span></span><button data-d="down">▼</button><span></span>
        </div>
        <div class="slider"><label data-i="manual_speed"></label><input type="range" min="0.05" max="1" step="0.01" data-k="manual_speed"><output></output></div>
      </div>

      <div class="card">
        <h3 data-i="tracking"></h3>
        <div class="seg" id="trackSeg" style="width:100%;display:flex">
          <button data-v="off" style="flex:1" data-i="off"></button><button data-v="face" style="flex:1" data-i="face"></button><button data-v="body" style="flex:1" data-i="body"></button>
        </div>
        <div class="row">
          <span class="lbl" data-i="presets"></span>
          <div class="chips" id="presets">
            <button class="chip" data-v="slow" data-i="slow"></button><button class="chip" data-v="normal" data-i="normal"></button><button class="chip" data-v="fast" data-i="fast"></button>
          </div>
        </div>
        <div class="slider"><label data-i="speed"></label><input type="range" min="0.1" max="1" step="0.01" data-k="max_speed" data-f="pct"><output></output></div>
        <div class="slider"><label data-i="response"></label><input type="range" min="0.5" max="8" step="0.1" data-k="kp" data-f="f1"><output></output></div>
        <div class="slider"><label data-i="smooth_start"></label><input type="range" min="0" max="0.9" step="0.01" data-k="smoothing" data-f="f2"><output></output></div>
        <div class="slider"><label data-i="deadzone"></label><input type="range" min="0" max="0.15" step="0.005" data-k="deadzone" data-f="pct"><output></output></div>
        <div class="slider"><label data-i="lead"></label><input type="range" min="0" max="0.4" step="0.01" data-k="lead" data-f="ms"><output></output></div>
        <div class="row" style="margin-top:14px">
          <label class="toggle"><input type="checkbox" data-k="sharp_stop"><span class="sw"></span><span class="t"><span data-i="sharp_stop"></span><small data-i="sharp_stop_hint"></small></span></label>
        </div>
        <div class="row">
          <label class="toggle"><input type="checkbox" data-k="invert_pan"><span class="sw"></span><span data-i="invert_pan"></span></label>
          <label class="toggle" style="margin-inline-start:14px"><input type="checkbox" data-k="invert_tilt"><span class="sw"></span><span data-i="invert_tilt"></span></label>
        </div>
      </div>

      <div class="card">
        <h3><span data-i="vcam"></span><span class="st"><span class="dot" id="vDot"></span></span></h3>
        <div class="row">
          <label class="toggle"><input type="checkbox" data-k="vcam_on"><span class="sw"></span><span data-i="vcam_on"></span></label>
          <div class="spacer"></div>
          <div class="seg" id="vcamSize"><button data-v="1080p">1080p</button><button data-v="720p">720p</button></div>
        </div>
        <div class="hint" data-i="vcam_hint"></div>
        <div class="err" id="vErr" style="display:none" data-i="vcam_error"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <span data-i="k_gimbal"></span></span>
    <span><kbd>Esc</kbd> <span data-i="stop"></span></span>
    <span><kbd>R</kbd> <span data-i="k_record"></span></span>
    <span><kbd>P</kbd> <span data-i="k_pause"></span></span>
    <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> <span data-i="k_track"></span></span>
  </footer>
</div>
<div class="disc" id="disc"><span data-i="disconnected"></span></div>

};

const $ = id => document.getElementById(id);
let lang = "tr", S = null, ws = null;
const t = (k, vars) => { let s = (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k; if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace("{" + a + "}", b); return s; };

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-it]").forEach(e => e.title = t(e.dataset.it));
  $("lang").value = lang;
  if (S) render(S);
}

// ---------- connection ----------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "blob";
  ws.onopen = () => $("disc").style.display = "none";
  ws.onclose = () => { $("disc").style.display = "grid"; setTimeout(connect, 1000); };
  let lastUrl = null;
  ws.onmessage = e => {
    if (typeof e.data === "string") { render(JSON.parse(e.data)); return; }
    const url = URL.createObjectURL(e.data);
    const img = $("preview");
    img.onload = () => { if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url; };
    img.src = url;
  };
}
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

// ---------- render ----------
const fmt = {
  pct: v => Math.round(v * 100) + "%", f1: v => (+v).toFixed(1), f2: v => (+v).toFixed(2), ms: v => Math.round(v * 1000) + " ms",
  def: v => Math.round(v * 100) + "%",
};
function setRange(el, v) {
  if (document.activeElement === el && el.dataset.dragging) return;
  el.value = v; paintRange(el);
}
function paintRange(el) {
  const p = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.setProperty("--p", p + "%");
  el.nextElementSibling.textContent = (fmt[el.dataset.f] || fmt.def)(+el.value);
}
function selSeg(seg, v) { seg.querySelectorAll("button").forEach(b => b.classList.toggle("sel", String(b.dataset.v) === String(v))); }
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

function render(s) {
  S = s;
  if (s.settings.lang !== lang) { lang = s.settings.lang; applyLang(); return; }
  const p = s.phone, g = s.gimbal;

  $("phoneDot").className = "dot " + (p.connected ? "ok" : (p.status === "server_error" ? "bad" : "warn"));
  $("phoneTxt").textContent = t("p_" + (p.connected ? "phone_connected" : p.status));
  $("gimbalDot").className = $("gDot2").className = "dot " + (g.connected ? "ok" : (["error", "not_found", "lost"].includes(g.status) ? "bad" : (g.status === "idle" ? "" : "warn")));
  $("gimbalTxt").textContent = t("g_" + (g.connected ? "connected" : g.status));
  $("gStatus").textContent = t("g_" + (g.connected ? "connected" : g.status)) + (g.firmware ? ` · fw ${g.firmware.toFixed(2)}` : "");
  $("gConnect").textContent = g.connected ? t("disconnect") : t("connect");
  $("gConnect").classList.toggle("primary", !g.connected);
  $("latTxt").textContent = s.stats.latency_ms != null && p.connected ? s.stats.latency_ms + " ms" : "—";
  $("fpsTxt").textContent = p.connected ? s.stats.fps : 0;

  $("qrOverlay").style.display = p.connected ? "none" : "grid";
  if (s.qr && $("qr").dataset.src !== s.qr) { $("qr").src = s.qr; $("qr").dataset.src = s.qr; }
  $("url").textContent = s.url;
  if (!p.connected) $("preview").removeAttribute("src");

  $("pausedOv").style.display = s.paused ? "grid" : "none";
  $("pauseTxt").textContent = s.paused ? t("resume") : t("pause");
  $("pauseBtn").classList.toggle("on", s.paused);

  $("recBadge").style.display = p.recording ? "flex" : "none";
  $("recTime").textContent = mmss(p.rec_secs || 0);
  $("recBtn").classList.toggle("on", p.recording);
  $("recBtn").disabled = !p.connected;
  $("recBtnTxt").textContent = p.recording ? t("record_stop") : t("record_start");
  selSeg($("qualitySeg"), p.quality);
  $("qualitySeg").querySelectorAll("button").forEach(b => b.disabled = p.recording);
  selSeg($("zoomSeg"), p.zoom);

  const f = s.file;
  const fs = $("fileStat");
  if (f.event === "begin" || f.event === "progress") fs.innerHTML = `<span>${t("file_receiving", { name: esc(f.name), mb: (f.received / 1e6).toFixed(0) })}</span>`;
  else if (f.event === "done") fs.innerHTML = `<span>${t("file_done", { name: esc(f.name) })}</span><button class="link" id="showFile">${t("show")}</button>`;
  else fs.innerHTML = "";
  const sf = $("showFile"); if (sf) sf.onclick = () => send({ cmd: "open_folder", path: f.path });

  selSeg($("trackSeg"), s.track_mode);
  document.querySelectorAll("input[type=range][data-k]").forEach(el => setRange(el, s.settings[el.dataset.k]));
  document.querySelectorAll("input[type=checkbox][data-k]").forEach(el => el.checked = !!s.settings[el.dataset.k]);
  selSeg($("vcamSize"), s.settings.vcam_size);
  $("vDot").className = "dot " + (s.vcam.ok ? "ok" : s.vcam.ok === false ? "bad" : "");
  $("vErr").style.display = s.vcam.ok === false ? "block" : "none";
}
const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- controls ----------
$("lang").onchange = e => {
  const v = e.target.value;
  send({ cmd: "set", key: "lang", value: v });
  if (S) S.settings.lang = v;
  lang = v; applyLang();
};
$("stopBtn").onclick = () => send({ cmd: "stop" });
$("pauseBtn").onclick = () => send({ cmd: "pause", value: !(S && S.paused) });
$("quitBtn").onclick = () => { send({ cmd: "quit" }); setTimeout(() => window.close(), 300); };
$("recBtn").onclick = () => send({ cmd: "record", value: !(S && S.phone.recording) });
$("folderBtn").onclick = () => send({ cmd: "open_folder" });
$("gConnect").onclick = () => send({ cmd: S && S.gimbal.connected ? "gimbal_disconnect" : "gimbal_connect" });
$("padStop").onclick = () => send({ cmd: "stop" });
$("qualitySeg").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "quality", value: v }); };
$("zoomSeg").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "zoom", value: +v }); };
$("trackSeg").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "track", value: v }); };
$("presets").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "preset", value: v }); };
$("gModes").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "gimbal_mode", value: v }); };
$("vcamSize").onclick = e => { const v = e.target.dataset.v; if (v) send({ cmd: "set", key: "vcam_size", value: v }); };
document.querySelectorAll("input[type=range][data-k]").forEach(el => {
  el.addEventListener("pointerdown", () => el.dataset.dragging = "1");
  el.addEventListener("pointerup", () => delete el.dataset.dragging);
  el.addEventListener("input", () => { paintRange(el); send({ cmd: "set", key: el.dataset.k, value: +el.value }); });
});
document.querySelectorAll("input[type=checkbox][data-k]").forEach(el =>
  el.addEventListener("change", () => send({ cmd: "set", key: el.dataset.k, value: el.checked })));

// d-pad (hold)
document.querySelectorAll(".pad button[data-d]").forEach(b => {
  const d = b.dataset.d;
  b.addEventListener("pointerdown", e => { b.setPointerCapture(e.pointerId); b.classList.add("held"); send({ cmd: "manual", dir: d, on: true }); });
  const up = () => { b.classList.remove("held"); send({ cmd: "manual", dir: d, on: false }); };
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
});

// keyboard
const keyDir = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
const held = new Set();
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (keyDir[e.key]) {
    e.preventDefault();
    if (!held.has(e.key)) { held.add(e.key); send({ cmd: "manual", dir: keyDir[e.key], on: true }); }
  } else if (e.key === "Escape") { send({ cmd: "stop" }); }
  else if (e.key === "p" || e.key === "P") { send({ cmd: "pause", value: !(S && S.paused) }); }
  else if (e.key === "r" || e.key === "R") { if (S && S.phone.connected) send({ cmd: "record", value: !S.phone.recording }); }
  else if (["1", "2", "3"].includes(e.key)) { send({ cmd: "track", value: ["off", "face", "body"][+e.key - 1] }); }
});
window.addEventListener("keyup", e => {
  if (keyDir[e.key]) { held.delete(e.key); send({ cmd: "manual", dir: keyDir[e.key], on: false }); }
});
window.addEventListener("blur", () => { for (const k of held) send({ cmd: "manual", dir: keyDir[k], on: false }); held.clear(); });

applyLang();
connect();
</script>
