name: GimbalScan
options:
  bundleIdPrefix: az.koala
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  GimbalScan:
    type: application
    platform: iOS
    sources: [GimbalScan]
    scheme: {}
    info:
      path: GimbalScan/Info.plist
      properties:
        CFBundleDisplayName: GimbalScan
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "LiDAR ile odanın 3D haritasını çıkarmak ve QR kodu okumak için."
        NSLocalNetworkUsageDescription: "Taramayı bilgisayardaki GimbalCam uygulamasına göndermek için."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: az.koala.gimbalscan
            CFBundleURLSchemes: [gimbalscan]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.koala.gimbalscan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
