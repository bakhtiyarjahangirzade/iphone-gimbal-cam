name: GimbalCam
options:
  bundleIdPrefix: az.koala
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  GimbalCam:
    type: application
    platform: iOS
    sources: [GimbalCam]
    scheme: {}
    info:
      path: GimbalCam/Info.plist
      properties:
        CFBundleDisplayName: GimbalCam
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Kamerayı bilgisayara webcam olarak göndermek için."
        NSMicrophoneUsageDescription: "Video kaydına ses eklemek için."
        NSLocalNetworkUsageDescription: "Bilgisayardaki GimbalCam uygulamasıyla Wi-Fi üzerinden bağlanmak için."
        NSBonjourServices: [_gimbalcam._tcp]
        NSPhotoLibraryAddUsageDescription: "Kayıtları Fotoğraflar'a kaydetmek için."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.koala.gimbalcam
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
