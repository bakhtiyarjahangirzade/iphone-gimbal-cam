name: Remove LiDAR scan (one-off)

on:
  push:
    paths:
      - ".github/workflows/cleanup.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete LiDAR files
        run: |
          git rm -r --ignore-unmatch ios-scan windows/gimbalcam/scan.py windows/gimbalcam/web/scan.html windows/gimbalcam/web/vendor tools/xr-test.html
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Remove LiDAR scanning" && git push || echo "nothing to remove"
      - name: Remove GimbalScan.ipa from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest GimbalScan.ipa -y -R "$GITHUB_REPOSITORY" || true
