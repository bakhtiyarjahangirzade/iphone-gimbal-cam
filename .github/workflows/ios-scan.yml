name: iOS GimbalScan build

on:
  push:
    paths:
      - "ios-scan/**"
      - ".github/workflows/ios-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-scan
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios-scan
        run: |
          set -o pipefail
          xcodebuild \
            -project GimbalScan.xcodeproj \
            -scheme GimbalScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package IPA
        working-directory: ios-scan
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GimbalScan.app Payload/
          zip -qry GimbalScan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GimbalScan-ipa
          path: ios-scan/GimbalScan.ipa
          retention-days: 30

      - name: Publish IPA to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: ios-scan/GimbalScan.ipa
