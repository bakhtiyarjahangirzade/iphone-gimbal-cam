name: Windows build

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Smoke test imports
        working-directory: windows
        run: python -c "import gimbalcam.app, gimbalcam.server, gimbalcam.gimbal, gimbalcam.tracker, mediapipe, av, bleak, pyvirtualcam; print('imports ok')"

      - name: Build exe
        working-directory: windows
        run: >
          pyinstaller run.py --name GimbalCam --noconfirm --windowed
          --add-data "gimbalcam/web;gimbalcam/web"
          --collect-data mediapipe --collect-binaries mediapipe
          --collect-all bleak --collect-submodules winrt
          --collect-all pyvirtualcam
          --hidden-import qrcode.image.pil

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path windows/dist/GimbalCam -DestinationPath GimbalCam-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GimbalCam-windows
          path: GimbalCam-windows.zip

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GimbalCam (son sürüm)
          prerelease: true
          files: GimbalCam-windows.zip
          body: Otomatik derleme. GimbalCam-windows.zip dosyasını indir, klasöre çıkar, GimbalCam.exe'yi çalıştır.
